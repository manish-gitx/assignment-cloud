{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "temp-converter.name" . }}
  labels:
    {{- include "temp-converter.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "temp-converter.selector" . | nindent 6 }}
{{- end }}
